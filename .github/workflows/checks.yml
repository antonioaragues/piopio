name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
  swift:
    # The app requires Xcode 27/macOS 27. Enable only after registering this runner.
    if: ${{ vars.PIOPIO_SWIFT_CI == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, macOS, ARM64, piopio-macos-27]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:swift
      - run: scripts/build-app.sh
