# Xcode project for the Piopio app. Generate with: scripts/build-app.sh (or `xcodegen` in this folder).
# The .xcodeproj is not committed; this file is the source of truth.
name: Piopio
options:
  bundleIdPrefix: app.piopio
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  PiopioPackage:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
  # Terminal drawer (docs/spec/05-build §9): local PTY terminals.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.11.2" # 1.12+ needs the Metal toolchain (GPU renderer)
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  Piopio:
    type: application
    platform: macOS
    sources:
      - path: Piopio
        excludes: [AppIcon.icon]
      # Icon Composer document: compiled by actool into the app icon (light and dark).
      - path: Piopio/AppIcon.icon
        type: file
        buildPhase: resources
      # Background mode: SMAppService.agent(plistName:) looks in Contents/Library/LaunchAgents.
      - path: LaunchAgents/app.piopio.engine.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PiopioPackage
        product: PiopioKit
      - package: PiopioPackage
        product: PiopioTranscript
      - package: Sparkle
      - package: SwiftTerm
      - target: piopio-engine
        embed: true
        codeSign: false
        copy:
          destination: executables
    postBuildScripts:
      # Release builds carry the engine and Node (docs/spec/02-architecture §4.1). Debug builds run the repo's
      # engine with the system Node; set PIOPIO_BUNDLE_ENGINE=YES to bundle there too.
      - name: Bundle engine
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$CONFIGURATION" == Release || "${PIOPIO_BUNDLE_ENGINE:-NO}" == YES ]]; then
            "$SRCROOT/../../../scripts/bundle-engine.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME" "$MARKETING_VERSION-$CURRENT_PROJECT_VERSION"
          fi
    info:
      path: Piopio/Info.plist
      properties:
        CFBundleDisplayName: Piopio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: MIT License
        # Agents' Apple app tools (docs/spec/06-agents §4.1), asked for once, when an agent first uses them.
        NSRemindersFullAccessUsageDescription: Your agents can read and change your reminders when you allow it in their definition.
        NSCalendarsFullAccessUsageDescription: Your agents can read and change your calendar events when you allow it in their definition.
        NSContactsUsageDescription: Your agents can look people up in your contacts when you allow it in their definition.
        NSAppleEventsUsageDescription: Your agents can use Notes and Music when you allow it in their definition.
        # Dev builds run the engine from the repo; release builds bundle it (see the Bundle engine phase).
        PiopioEngineMain: $(PIOPIO_ENGINE_MAIN)
        # What the bundled engine reports in engine.hello; a background engine with another version is restarted.
        PiopioEngineVersion: $(MARKETING_VERSION)-$(CURRENT_PROJECT_VERSION)
        # Sparkle 2. Updates stay off while either is empty (see docs/releasing.md).
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piopio.Piopio
        PRODUCT_NAME: Piopio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Piopio/AppIcon.icon (Icon Composer format: light and dark artwork, docs/design/icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PIOPIO_ENGINE_MAIN: $(SRCROOT)/../../../packages/engine/dist/main.js
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_KEY: ""
  piopio-engine:
    type: tool
    platform: macOS
    sources: [EngineLauncher]
    settings:
      base:
        PRODUCT_NAME: piopio-engine
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
schemes:
  Piopio:
    build:
      targets:
        Piopio: all
    run:
      config: Debug
      environmentVariables:
        - variable: PIOPIO_FAUX
          value: "1"
          isEnabled: false
