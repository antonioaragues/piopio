<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:230px;height:100%;padding:8px;box-sizing:border-box;flex:none;display:flex">
  <div style="flex:1;background:var(--glass);border-radius:12px;box-shadow:0 0 0 .5px var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;font-size:13px">
    <div style="display:flex;gap:8px;padding:4px 8px 14px"><div style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></div><div style="width:12px;height:12px;border-radius:50%;background:#febc2e"></div><div style="width:12px;height:12px;border-radius:50%;background:#28c840"></div></div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
      <sc-if value="{{ r.isHead }}"><div style="font-size:11px;font-weight:600;color:var(--fg3);padding:12px 8px 4px">{{ r.label }}</div></sc-if>
      <sc-if value="{{ r.isItem }}">
        <div style="display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;background:{{ r.bg }};font-weight:{{ r.fw }};color:var(--fg)">
          <span style="width:20px;height:20px;border-radius:5px;background:{{ r.color }};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none">{{ r.glyph }}</span>
          <span style="flex:1">{{ r.label }}</span>
          <sc-if value="{{ r.count }}"><span style="font-size:11.5px;color:var(--fg3);font-weight:400">{{ r.count }}</span></sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;general&quot;,&quot;models&quot;,&quot;connectors&quot;,&quot;chat&quot;,&quot;approvals&quot;,&quot;mcp&quot;,&quot;extensions&quot;,&quot;engines&quot;],&quot;default&quot;:&quot;mcp&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;counts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'mcp';
    const counts = this.props.counts || {};
    const it = (key, label, glyph, color) => ({ isItem: true, key, label, glyph, color, count: counts[key] || '', bg: key === a ? 'var(--accentSoft)' : 'transparent', fw: key === a ? 600 : 400 });
    const hd = (label) => ({ isHead: true, label });
    return { rows: [
      it('general', 'General', '⚙︎', '#8e8e93'),
      it('models', 'Models', '✦', '#0a84ff'),
      it('connectors', 'Connectors', '⇄', '#30b0c7'),
      it('chat', 'Chat', '◌', '#32ade6'),
      it('approvals', 'Approvals', '✓', '#f2a33a'),
      hd('Extend'),
      it('mcp', 'MCP servers', '⌁', '#bf5af2'),
      it('extensions', 'Extensions', '◆', '#5e5ce6'),
      hd('Where it runs'),
      it('engines', 'This Mac & cloud', '▣', '#34c759')
    ] };
  }
}
</script>
</body>
</html>
